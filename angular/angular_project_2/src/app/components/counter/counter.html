<h3 class="text-center">Counter Example Using NgRx</h3>

<div class="border border-3 rounded-3 p-3 col-sm-4 offset-4">
  <button class="btn btn-danger" (click)="decrement_val()">Decrement</button>
  <h2>Count:{{count$ | async}}</h2>
  <button class="btn btn-primary" (click)="increment_val()">Increment</button>
</div>
