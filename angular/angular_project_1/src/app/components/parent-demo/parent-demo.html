<div class="container border border-2 rounded-2 my-2 p-2 ">
  <div class="row text-center">
    <div>This is Parent Component</div>
    <div>My own data a is: {{a}}
      <input type="number" [(ngModel)]="a"></div>
    <div>my child data Course Name: {{child1.courseName}}</div>
    <div>my child data location: {{location}}</div>
  </div>
  <div class="row mt-3">
    <div class="col-sm-6 border border-2 rounded-2 p-2">
      <app-child1-demo [a]="a" #child1 (locationEvent)="receiveLocationData($event)"></app-child1-demo>
    </div>
    <div class="col-sm-6 border border-2 rounded-2 p-2">
      <app-child2-demo [aChild2]="a" [courseName]="child1.courseName"></app-child2-demo>
    </div>
  </div>
</div>
