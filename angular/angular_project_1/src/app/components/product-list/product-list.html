<h3 class="text-center">Product List</h3>

<div class="container">
  <div class="row">
    <div class="col-sm-2">
      <select [(ngModel)]="selectedCategory">
        @for (category of categorySet; track $index) {
          <option>{{ category }}</option>
        }
      </select>
    </div>
  </div>
  <div class="row">
    @for (product of filteredProducts; track $index) {
      <div class="col-sm-3 card my-1">
        <img src="{{ product.image }}" class="card-img-top" alt="..." style="height: 200px" />
        <div class="card-body text-center">
          <h5 class="card-title">{{ product.category }}</h5>
          <p class="card-text text-truncate">{{ product.title }}</p>
          <p class="card-text text-truncate">{{ product.description }}</p>
          <p class="card-text">{{ product.price }}</p>
          <p class="card-text">{{ product.rating.rate }}* ({{ product.rating.count }})</p>
          <a href="#" class="btn btn-primary">Buy Now</a>
        </div>
      </div>
    }@empty {
      <div>No Products To Display</div>
    }
  </div>
</div>
