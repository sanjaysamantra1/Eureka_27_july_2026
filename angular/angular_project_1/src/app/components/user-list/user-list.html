<h3 class="text-center">User List</h3>

<div class="container">
  <div class="row">
    @for (user of users | async; track $index) {
    <div class="col-sm-3 card my-1">
      <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRmetdnWaMgTRpmnyKLyoaE44IFCAEMT36HFcJDXboRDtWlMhH3iiy0IXA&s=10" class="card-img-top" alt="..." style="height: 200px" />
      <div class="card-body text-center">
        <h5 class="card-title">{{ user.username }}</h5>
        <p class="card-text text-truncate">{{user.name }}</p>
        <p class="card-text text-truncate">{{user.email }}</p>
        <p class="card-text">{{user.phone }}</p>
        <p class="card-text">{{user.address.city }})</p>
        <a href="#" class="btn btn-primary">Details</a>
      </div>
    </div>
    }
  </div>
</div>
