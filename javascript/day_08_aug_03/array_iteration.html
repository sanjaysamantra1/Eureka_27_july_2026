<script>
    let cars = ['Tata', 'Honda', 'Maruti', 'Hyundai']

    // 1. loop
    for (let i = 0; i < cars.length; i++) {
        console.log(cars[i]);
    }
    console.log("===========")

    // 2. for-in loop   2015   ES_6
    for (i in cars) {
        console.log(cars[i])
    }
    console.log("===========")

    // 3. for-of loop
    for (car of cars) {
        console.log(car)
    }
    console.log("===========")

    // 4. forEach()
    cars.forEach((ele, ind, arr) => {
        console.log(ele, ind, arr)
    })
</script>
