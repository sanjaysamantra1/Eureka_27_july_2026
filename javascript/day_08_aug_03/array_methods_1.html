<script>
    let arr = [10, 20, 30, 40, 10, 20, 30];

    console.log(arr.at(1));  // 20
    console.log(arr[1]);     // 20

    // at() supports -ve index also
    console.log(arr.at(-1));  // 20
    console.log(arr[-1]);     // 20

    console.log(arr.indexOf(20));      // 1
    console.log(arr.lastIndexOf(20));  // 5

    console.log(arr.includes(40))  // true
    console.log(arr.includes(60))  // false
</script>
