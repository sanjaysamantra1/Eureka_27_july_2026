<script>
    // write a function that should add any number of arguements
    function add(...arr) {  // arr is REST param
        let sum = 0;
        for (ele of arr) {
            sum = sum + ele;
        }
        console.log(`Sum is: ${sum}`)
    }
    add(10, 20)
    add(10, 20, 30)
    add(10, 20, 30, 40, 50)

</script>
