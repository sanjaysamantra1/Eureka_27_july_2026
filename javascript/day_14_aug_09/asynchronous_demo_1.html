<script>
    console.log('Program Execution starts here...')

    async function fetchUsers() {
        let response = await fetch('https://jsonplaceholder.typicode.com/users');
        let finalResponse = await response.json();
        console.log('Users: ', finalResponse)
    }
    fetchUsers(); // Async , i will let the next statements to execute 

    async function fetchComments() {
        let response = await fetch('https://jsonplaceholder.typicode.com/comments');
        let finalResponse = await response.json();
        console.log('Comments: ', finalResponse)
    }
    fetchComments();  //  Async , i will let the next statements to execute 

    console.log('Program Execution ends here...')
</script>
