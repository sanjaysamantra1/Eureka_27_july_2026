<script>
    let num1 = prompt('Enter First Number'); // prompt() always returns "10"
    let num2 = prompt('Enter Second Number');
    let sum = +num1 + parseInt(num2);

    // string concat
    console.log('Addition of', num1, 'and', num2, 'is', sum);

    // template literal
    console.log(`Addition of ${num1} and ${num2} is ${sum}`);
</script>
