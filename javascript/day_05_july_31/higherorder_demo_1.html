<script>
    let arr = [10, 20, 30, 40, 50];
    // increas each value by 5 
    function incrementBy5(ele) {
        return ele + 5;
    }
    let res = arr.map(incrementBy5);
    console.log(res);
    // map() is higherorder function as it takes another function a s arguement
    // incrementBy5() is callback function as it is passed as arguement 
</script>
