<script>
    let rem = 0, sum = 0;
    let sumofDigits = (num) => { // arrow 
        while (num != 0) {
            rem = num % 10;
            sum = sum + rem;
            num = parseInt(num / 10);
        }
        return sum;
    }
    let res = sumofDigits(125);
    console.log('Result is: ', res);
</script>
