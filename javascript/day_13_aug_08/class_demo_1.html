<script>
    class Student {
        constructor(roll, name, course, passyear) {
            this.roll = roll;
            this.name = name;
            this.course = course;
            this.passyear = passyear;
        }
        displayInfo() {
            console.log(this.roll, this.name, this.course, this.passyear)
            // console.log(a, b, c, d)
        }
    }
    let std1 = new Student(1, 'Manish', 'Python', 2025);
    let std2 = new Student(2, 'Rajsekhar', 'React', 2026);

    console.log(std1)
    console.log(std2)

    std1.displayInfo()
</script>
