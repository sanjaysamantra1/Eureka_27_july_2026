<script>
    /*  10. Ask user to enter a roman string and convert that to integer value
    input:   IX    XII
    output : 9     12 */
    const romanMap = {
        'I': 1, 'V': 5, 'X': 10, 'L': 50,
        'C': 100, 'D': 500, 'M': 1000
    }
    function romanToInt(str) {
        let total = 0;
        for (let i = 0; i < str.length; i++) {
            let currentValue = romanMap[str[i]];
            let nextValue = romanMap[str[i + 1]];

            if (currentValue < nextValue) {
                total = total - currentValue;
            } else {
                total = total + currentValue;
            }
        }
        return total;
    }
    console.log(romanToInt('IX')) // 9
    console.log(romanToInt('XII')) // 12

      1. iterate each char
      2. get the value for current char from roman map
      3. get the value for the next char from roman map
      4. if(curr < next) total = total - current
      4. else 
         total = total +curr
    */
</script>
